services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicte-scrutiny-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: aicte-scrutiny-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
